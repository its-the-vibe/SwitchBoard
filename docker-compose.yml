services:
  switchboard:
    build: .
    image: ghcr.io/its-the-vibe/switchboard:latest
    pull_policy: always
    read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT}:8080"
    environment:
      - PORT=8080
    volumes:
      - ./config.json:/app/config.json:ro
    restart: on-failure:10
